name: dotnet-pack

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Prepare local artifacts source
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .\dotnet\artifacts | Out-Null
      - name: Restore
        run: dotnet restore .\dotnet\DeepSeek.OCR2.sln
      - name: Build
        run: dotnet build .\dotnet\DeepSeek.OCR2.sln -c Release --no-restore
      - name: Pack
        working-directory: dotnet
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\pack.ps1 -Configuration Release -Output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: dotnet\artifacts\*.nupkg
