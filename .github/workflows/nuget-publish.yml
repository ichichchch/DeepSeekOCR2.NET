name: nuget-publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"
      - name: Prepare local artifacts source
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .\dotnet\artifacts | Out-Null
      - name: Restore
        run: dotnet restore .\dotnet\DeepSeek.OCR2.ci.slnf
      - name: Build
        run: dotnet build .\dotnet\DeepSeek.OCR2.ci.slnf -c Release --no-restore
      - name: Pack
        working-directory: dotnet
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\pack.ps1 -Configuration Release -Output artifacts -PackBundled
      - name: NuGet smoke test (local artifacts)
        run: dotnet build .\dotnet\tests\DeepSeek.OCR2.NuGetSmokeTest\DeepSeek.OCR2.NuGetSmokeTest.csproj -c Release
      - name: Push packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { Write-Host "NUGET_API_KEY not set; skipping push"; exit 0 }
          dotnet nuget push .\dotnet\artifacts\DeepSeek.OCR2*.nupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push .\dotnet\artifacts\DeepSeek.OCR2*.snupkg --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Unlist internal packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) { Write-Host "NUGET_API_KEY not set; skipping unlist"; exit 0 }
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith("v")) { $ver = $ver.Substring(1) }
          $source = "https://api.nuget.org/v3/index.json"
          $ids = @(
            "DeepSeek.OCR2.Core",
            "DeepSeek.OCR2.Assets.Python.win-x64",
            "DeepSeek.OCR2.Assets.Wheels.win-x64",
            "DeepSeek.OCR2.Assets.Model.DeepSeekOCR2"
          )
          foreach ($id in $ids) {
            try {
              dotnet nuget delete $id $ver --api-key "$env:NUGET_API_KEY" --source $source --non-interactive
            }
            catch {
              Write-Host "Unlist failed for $id $ver: $($_.Exception.Message)"
            }
          }

